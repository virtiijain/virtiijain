<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b"/>
    </pattern>
    <radialGradient id="glow1" cx="85%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="380" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
      .fade { opacity: 0; animation: in .8s ease forwards; }
      @keyframes in { to { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="380" fill="#0b0f19"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <rect width="1200" height="380" fill="url(#glow1)"/>
    <rect width="1200" height="380" fill="url(#glow2)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#1e293b"/>

  <!-- Left: identity -->
  <g class="fade">
    <text x="64" y="112" class="sans" font-size="14" font-weight="600" letter-spacing="3" fill="#38bdf8">WEB &amp; MOBILE APP DEVELOPER</text>
    <text x="62" y="186" class="sans" font-size="68" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">Virti Jain</text>
    <text x="64" y="232" class="sans" font-size="20" fill="#94a3b8">Building scalable web platforms and</text>
    <text x="64" y="260" class="sans" font-size="20" fill="#94a3b8">cross-platform mobile applications.</text>
  </g>

  <g class="fade" style="animation-delay:.3s">
    <rect x="64"  y="298" width="180" height="34" rx="17" fill="#111827" stroke="#1f2937"/>
    <circle cx="84" cy="315" r="4" fill="#22c55e"/>
    <text x="96" y="320" class="sans" font-size="13" font-weight="500" fill="#cbd5e1">Full-time Developer</text>

    <rect x="254" y="298" width="112" height="34" rx="17" fill="#111827" stroke="#1f2937"/>
    <circle cx="274" cy="315" r="4" fill="#38bdf8"/>
    <text x="286" y="320" class="sans" font-size="13" font-weight="500" fill="#cbd5e1">Freelancer</text>

    <rect x="376" y="298" width="140" height="34" rx="17" fill="#111827" stroke="#1f2937"/>
    <circle cx="396" cy="315" r="4" fill="#818cf8"/>
    <text x="408" y="320" class="sans" font-size="13" font-weight="500" fill="#cbd5e1">Gujarat, India</text>
  </g>

  <!-- Right: code card -->
  <g class="fade" style="animation-delay:.6s">
    <rect x="780" y="72" width="356" height="236" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <path d="M794 72 h328 a14 14 0 0 1 14 14 v22 h-356 v-22 a14 14 0 0 1 14 -14 z" fill="#111827"/>
    <line x1="780" y1="108" x2="1136" y2="108" stroke="#1e293b"/>
    <circle cx="802" cy="90" r="5" fill="#334155"/>
    <circle cx="820" cy="90" r="5" fill="#334155"/>
    <circle cx="838" cy="90" r="5" fill="#334155"/>
    <text x="958" y="95" text-anchor="middle" class="mono" font-size="12" fill="#64748b">stack.ts</text>

    <g class="mono" font-size="13.5" xml:space="preserve">
      <text x="804" y="142"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> stack = {</tspan></text>
      <text x="804" y="170"><tspan fill="#7dd3fc">  web</tspan><tspan fill="#e2e8f0">:    </tspan><tspan fill="#86efac">"Next.js · React"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="804" y="196"><tspan fill="#7dd3fc">  mobile</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"React Native · Flutter"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="804" y="222"><tspan fill="#7dd3fc">  api</tspan><tspan fill="#e2e8f0">:    </tspan><tspan fill="#86efac">"Node.js · Express"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="804" y="248"><tspan fill="#7dd3fc">  db</tspan><tspan fill="#e2e8f0">:     </tspan><tspan fill="#86efac">"MongoDB · Firebase"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="804" y="276"><tspan fill="#e2e8f0">};</tspan></text>
    </g>
  </g>
</svg>
